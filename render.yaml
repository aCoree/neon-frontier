# Render.com Blueprint: Multiplayer-Server (kostenloser Plan möglich).
# Geheime Werte (DATABASE_URL, OWNER_REGISTER_CODE, BACKUP_PASSPHRASE) trägst du im Render-Dashboard ein – sie stehen NICHT im Repository.
services:
  - type: web
    name: neon-frontier
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OWNER_USERNAME
        value: Aurelio
      - key: DATABASE_URL
        sync: false
      - key: OWNER_REGISTER_CODE
        sync: false
      - key: BACKUP_PASSPHRASE   # optional: schaltet den verschlüsselten Backup-Download im Admin-Bereich frei (mind. 12 Zeichen)
        sync: false
